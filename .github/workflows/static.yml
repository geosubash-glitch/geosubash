# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Browsers keep the CSS/JS for a while, so give every deploy its own version:
      # src="js/main.js" -> src="js/main.js?v=<commit>" in each page, so visitors always get the new files.
      - name: Leave source-only files out of the site
        run: rm -rf CLAUDE.md .claude tools raw v2/DESIGN.md
      - name: Stamp asset versions
        run: |
          v="${GITHUB_SHA::7}"
          for f in index.html v2/index.html admin.html; do
            [ -f "$f" ] || continue
            sed -i -E "s#(src=\"[^\"?:]+\.js)\"#\1?v=$v\"#g; s#(href=\"[^\"?:]+\.css)\"#\1?v=$v\"#g" "$f"
          done
          grep -hoE '(src|href)="[^"]+\?v=[^"]+"' index.html v2/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
