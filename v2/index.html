<!DOCTYPE html>

<body>
  <div class="frame">
    <!-- window chrome: title bar, address bar, tabs -->

      <div class="titlebar">
        <span class="tb-name">geo subash network</span>
        <span class="tb-btns" aria-hidden="true"><i>_</i><i>□</i><i>×</i></span>
      </div>
      <div class="addressbar">
        <span class="px">address</span>
        <span class="addr" id="addr">C:/geosubash/index</span>
        <a class="go px" href="#/">go</a>
      </div>

        <a href="#/" data-nav="home"><b class="px">01</b> index</a>

          <a class="cta" id="cta" href="#"><span id="scramble">Get in touch</span></a>

      <div class="statusbar">
        <span class="px" id="status-left">done</span>
        <span class="px" id="status-right"></span>
      </div>
    </footer>

  <div class="wipe" id="wipe" aria-hidden="true"><span class="px">loading…</span></div>
  <div class="preview" id="preview" aria-hidden="true"><img alt="" /></div>

  <script src="../js/assets.generated.js"></script>
  <script src="../js/projects.js"></script>
